# 저장소 내 위치: .github/workflows/update_etf_signals.yml
name: Update ETF Signals JSON

on:
  schedule:
    # 미국 정규장 마감 이후 평일 자동 실행 (UTC 21:30 = 한국시간 화~토 06:30)
    # 서머타임 기간에는 20:30 UTC(05:30 KST)로 앞당겨 사용 가능
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "수집할 ETF 티커 (코어: QQQ,SCHD,JEPI,JEPQ / 위성: SMH,QLD,USD,SOXL)"
        required: false
        default: "QQQ,SCHD,JEPI,JEPQ,SMH,QLD,USD,SOXL"

permissions:
  contents: write

jobs:
  update-etf-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Fetch ETF signals JSON
        env:
          # 기본: 안정적 코어(QQQ, SCHD, JEPI, JEPQ) + 성장·레버리지 위성(SMH, QLD, USD, SOXL)
          ETF_TICKERS: ${{ github.event.inputs.tickers || 'QQQ,SCHD,JEPI,JEPQ,SMH,QLD,USD,SOXL' }}
        run: |
          python fetch_etf_signals.py --output data/etf_signals.json

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf_signals.json
          if git diff --staged --quiet; then
            echo "변경된 시세 데이터가 없어 커밋을 건너뜁니다."
          else
            UPDATED_AT=$(python -c "import json; print(json.load(open('data/etf_signals.json'))['updatedAt'])")
            git commit -m "chore(data): update ETF signals (${UPDATED_AT})"
            git push
          fi
